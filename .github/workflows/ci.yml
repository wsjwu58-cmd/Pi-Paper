name: CI

# 桌面分支与桌面 PR 的质量检查
on:
  push:
    branches: [feat/desktop-local-migration]
  pull_request:
    branches: [feat/desktop-local-migration]

# 同分支新推送取消旧运行，节省额度
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pi-agent-service:
    name: Pi Agent service (lint + typecheck + unit)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: pi-main
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node 22
        uses: actions/setup-node@v5
        with:
          node-version: '22.19.0'
          cache: npm
          cache-dependency-path: pi-main/package-lock.json
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Build Pi core packages
        run: npm run build:offline
      - name: Biome lint
        run: npx biome check packages/vibepaper-agent-service/src packages/vibepaper-agent-service/test
      - name: Typecheck
        run: npx tsgo -p packages/vibepaper-agent-service/tsconfig.build.json --noEmit
      - name: Unit and migration tests
        run: npm exec -- vitest --run packages/vibepaper-agent-service/test

  # ──────────────────────────────────────────────
  # 前端：oxlint 规范检查 + Vite 生产构建
  # ──────────────────────────────────────────────
  web:
    name: 前端 (oxlint + vite build)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: vibepaper-web

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node 22
        uses: actions/setup-node@v5
        with:
          node-version: '22.19.0'
          cache: pnpm
          cache-dependency-path: vibepaper-web/pnpm-lock.yaml

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: Lint (oxlint)
        run: pnpm lint

      - name: 构建 (tsc + vite build)
        run: pnpm build

  desktop:
    name: Desktop Worker and local canvas tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22.19.0'
          cache: npm
          cache-dependency-path: |
            pi-main/package-lock.json
            vibepaper-desktop/package-lock.json
      - name: Install Pi and desktop dependencies
        run: |
          npm --prefix pi-main ci --ignore-scripts
          npm --prefix vibepaper-desktop ci --ignore-scripts
      - name: Build Pi dependencies
        run: npm --prefix pi-main run build:offline
      - name: Desktop Worker smoke
        run: npm --prefix vibepaper-desktop run test:agent-runtime
      - name: Local canvas and export tests
        run: node --test vibepaper-desktop/test/project-store-canvas-validation.test.cjs vibepaper-desktop/test/canvas-media.test.cjs vibepaper-desktop/test/node-export.test.cjs
