name: CI

on:
  push:
    branches: ['**']
  pull_request:
  merge_group:
  schedule:
    - cron: '23 18 * * *'
  workflow_dispatch:
  workflow_call:
    inputs:
      full:
        type: boolean
        default: false
      release:
        type: boolean
        default: false
    secrets:
      MAC_CSC_LINK:
        required: false
      MAC_CSC_KEY_PASSWORD:
        required: false
      APPLE_ID:
        required: false
      APPLE_APP_SPECIFIC_PASSWORD:
        required: false
      APPLE_TEAM_ID:
        required: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      runtime: ${{ steps.paths.outputs.runtime }}
      docker: ${{ steps.paths.outputs.docker }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - id: paths
        env:
          FULL: ${{ inputs.full || false }}
        run: node .github/scripts/changes.cjs

  workflow:
    name: Workflow contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - run: node --test .github/scripts/*.test.cjs
      - name: Validate Actions syntax and expressions
        # Pin the linter version. Shellcheck remains enabled in the official image.
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.7 -color

  pi-agent-service:
    name: Agent lint, types and unit tests
    needs: changes
    if: needs.changes.outputs.runtime == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-desktop
      - name: Lint and typecheck
        working-directory: pi-main
        run: |
          npx biome check packages/vibepaper-agent-service/src packages/vibepaper-agent-service/test
          npx tsgo -p packages/vibepaper-agent-service/tsconfig.build.json --noEmit
      - name: Unit and migration tests
        working-directory: pi-main
        run: npx vitest run packages/vibepaper-agent-service/test --reporter=default --reporter=junit --outputFile.junit=../.test-temp/ci/agent.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: agent-reports-${{ github.sha }}
          path: .test-temp/ci/
          if-no-files-found: warn
          retention-days: 14

  web:
    name: Renderer lint, types, unit tests and build
    needs: changes
    if: needs.changes.outputs.runtime == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: pi-paper-web
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: '9.15.9'
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: pi-paper-web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm test --reporter=default --reporter=junit --outputFile.junit=../.test-temp/ci/web.xml
      - run: pnpm build
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: web-reports-${{ github.sha }}
          path: .test-temp/ci/
          if-no-files-found: warn
          retention-days: 14

  desktop:
    name: Desktop unit, recovery and UI smoke tests
    needs: changes
    if: needs.changes.outputs.runtime == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-desktop
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build standalone application and exercise Worker recovery
        run: npm run build:package --prefix pi-paper-desktop
      - name: Desktop regression tests
        run: |
          mkdir -p .test-temp/ci
          node --test --test-reporter=spec --test-reporter-destination=stdout --test-reporter=junit --test-reporter-destination=.test-temp/ci/desktop.xml pi-paper-desktop/test/*.test.cjs
      - name: Marketplace UI on staged application
        working-directory: pi-paper-desktop
        run: xvfb-run -a node node_modules/electron/cli.js scripts/smoke-marketplace.cjs --staged --no-sandbox --screenshot=../.test-temp/ci/marketplace.png --failure-screenshot=../.test-temp/ci/marketplace-failure.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-reports-${{ github.sha }}
          path: .test-temp/ci/
          if-no-files-found: warn
          retention-days: 14

  quality:
    name: Quality gate
    if: always()
    needs: [changes, workflow, pi-agent-service, web, desktop]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - env:
          PHASE: quality
          RESULTS: ${{ toJSON(needs) }}
        run: node .github/scripts/gate.cjs

  installers:
    needs: [changes, quality]
    if: >-
      needs.changes.outputs.runtime == 'true' &&
      (inputs.full || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'push' && (github.ref_name == 'feat/desktop-local-migration' || github.ref_name == github.event.repository.default_branch)))
    uses: ./.github/workflows/desktop-packages.yml
    with:
      release: ${{ inputs.release || false }}
    secrets: inherit

  docker:
    needs: changes
    if: needs.changes.outputs.docker == 'true'
    uses: ./.github/workflows/docker-desktop.yml

  gate:
    name: CI gate
    if: always()
    needs: [changes, quality, installers, docker]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - env:
          PHASE: final
          RESULTS: ${{ toJSON(needs) }}
          INSTALLERS_EXPECTED: >-
            ${{ needs.changes.outputs.runtime == 'true' &&
                (inputs.full || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' ||
                 (github.event_name == 'push' && (github.ref_name == 'feat/desktop-local-migration' || github.ref_name == github.event.repository.default_branch))) }}
        run: node .github/scripts/gate.cjs
