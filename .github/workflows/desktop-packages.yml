name: Desktop installers

on:
  workflow_call:
  workflow_dispatch:
  push:
    branches: ['codex/desktop-packages-*']
    tags: ['desktop-v*']

permissions:
  contents: read

jobs:
  package:
    name: Package ${{ matrix.platform }} ${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win
            arch: x64
          - os: macos-15-intel
            platform: mac
            arch: x64
          - os: macos-15
            platform: mac
            arch: arm64
          - os: ubuntu-24.04
            platform: linux
            arch: x64
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            pi-paper-desktop/package-lock.json
            pi-main/package-lock.json
      - uses: pnpm/action-setup@v4
        with:
          version: '9.15.9'
      - name: Install Pi dependencies
        run: npm ci --prefix pi-main --ignore-scripts
      - name: Build Pi dependencies offline
        working-directory: pi-main
        run: |
          npm run build --workspace=@earendil-works/pi-telemetry
          node ../pi-paper-desktop/scripts/restore-model-data.cjs
          npm run build:offline --workspace=@earendil-works/pi-ai
          npm run build --workspace=@earendil-works/pi-agent-core
      - name: Install renderer dependencies
        working-directory: pi-paper-web
        run: pnpm install --frozen-lockfile
      - name: Install desktop dependencies
        run: npm ci --prefix pi-paper-desktop
      - name: Build standalone desktop application
        run: npm run build:package --prefix pi-paper-desktop
      - name: Verify language defaults and persistence
        run: node --test pi-paper-desktop/test/ui-language.test.cjs pi-paper-desktop/test/legacy-credential-read.test.cjs
      - name: Verify Linux packaged-resource interface language
        if: matrix.platform == 'linux'
        working-directory: pi-paper-desktop
        run: |
          xvfb-run -a node_modules/.bin/electron scripts/smoke-ui-language.cjs --app-dir=dist/app --no-sandbox
          xvfb-run -a node_modules/.bin/electron scripts/smoke-ui-language.cjs --app-dir=dist/app --resume --no-sandbox
      - name: Upload Linux language screenshots and reports
        if: always() && matrix.platform == 'linux'
        uses: actions/upload-artifact@v4
        with:
          name: Pi-Paper-linux-language-evidence
          if-no-files-found: warn
          path: docs/verification/2026-10-08-ui-language/
      - name: Create installers
        working-directory: pi-paper-desktop
        run: npx electron-builder --config electron-builder.cjs --${{ matrix.platform }} --${{ matrix.arch }} --publish never
      - name: Verify packaged Electron runtime in Node mode
        run: node pi-paper-desktop/scripts/verify-packaged.cjs
      # The marketplace GUI smoke uses the installed resources with the test
      # harness Electron. verify-packaged separately runs the shipped binary in Node mode.
      - name: Exercise marketplace UI with Windows installed resources
        if: matrix.platform == 'win'
        shell: pwsh
        working-directory: pi-paper-desktop
        run: |
          $installer = (Get-ChildItem release/*.exe | Select-Object -First 1).FullName
          $target = Join-Path $env:RUNNER_TEMP 'marketplace-install'
          $proc = Start-Process -Wait -PassThru -FilePath $installer -ArgumentList '/S', "/D=$target"
          if ($proc.ExitCode -ne 0) { throw "Installer exited with $($proc.ExitCode)" }
          node scripts/verify-packaged.cjs "--executable=$target/Pi-Paper.exe" "--app-dir=$target/resources/app"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node node_modules/electron/cli.js scripts/smoke-marketplace.cjs "--resources=$target/resources/app"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Exercise marketplace UI with Linux AppImage resources
        if: matrix.platform == 'linux'
        working-directory: pi-paper-desktop
        run: |
          release/*.AppImage --appimage-extract >/dev/null
          LD_LIBRARY_PATH="$PWD/squashfs-root/usr/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" \
            node scripts/verify-packaged.cjs --executable=squashfs-root/pi-paper --app-dir=squashfs-root/resources/app
          xvfb-run -a node node_modules/electron/cli.js scripts/smoke-marketplace.cjs --resources=squashfs-root/resources/app --no-sandbox
      - name: Exercise marketplace UI with macOS disk image resources
        if: matrix.platform == 'mac'
        working-directory: pi-paper-desktop
        run: |
          mountpoint=$(mktemp -d)
          hdiutil attach -readonly -nobrowse -mountpoint "$mountpoint" release/*.dmg
          trap 'hdiutil detach "$mountpoint"' EXIT
          node scripts/verify-packaged.cjs "--executable=$mountpoint/Pi-Paper.app/Contents/MacOS/Pi-Paper" "--app-dir=$mountpoint/Pi-Paper.app/Contents/Resources/app"
          node node_modules/electron/cli.js scripts/smoke-marketplace.cjs "--resources=$mountpoint/Pi-Paper.app/Contents/Resources/app"
      - name: Generate checksums
        run: node pi-paper-desktop/scripts/package-checksums.cjs
      - name: Upload installers
        if: matrix.platform != 'mac'
        uses: actions/upload-artifact@v4
        with:
          name: Pi-Paper-${{ matrix.platform }}-${{ matrix.arch }}
          if-no-files-found: error
          path: |
            pi-paper-desktop/release/*.exe
            pi-paper-desktop/release/*.dmg
            pi-paper-desktop/release/*.zip
            pi-paper-desktop/release/*.AppImage
            pi-paper-desktop/release/*.deb
            pi-paper-desktop/release/SHA256SUMS.txt
      - name: Upload macOS disk image
        if: matrix.platform == 'mac'
        uses: actions/upload-artifact@v4
        with:
          name: Pi-Paper-mac-${{ matrix.arch }}-dmg
          compression-level: 0
          if-no-files-found: error
          path: |
            pi-paper-desktop/release/*.dmg
            pi-paper-desktop/release/SHA256SUMS.txt
      - name: Upload macOS application archive
        if: matrix.platform == 'mac'
        uses: actions/upload-artifact@v4
        with:
          name: Pi-Paper-mac-${{ matrix.arch }}-zip
          compression-level: 0
          if-no-files-found: error
          path: |
            pi-paper-desktop/release/*.zip
            pi-paper-desktop/release/SHA256SUMS.txt
