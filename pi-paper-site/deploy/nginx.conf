server {
    listen 80;
    server_name 60.205.109.84 wsjaly.cn;
    root /var/www/pi-paper/current;
    index index.html;
    charset utf-8;
    server_tokens off;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'self'" always;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/pi-paper/acme;
        default_type text/plain;
        try_files $uri =404;
    }

    location = /index.html {
        expires -1;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    location /assets/ {
        expires 7d;
        try_files $uri =404;
    }

    location ~ /\. {
        deny all;
    }
}
