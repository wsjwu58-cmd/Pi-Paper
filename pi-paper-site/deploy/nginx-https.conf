# Activate only after certbot has issued the wsjaly.cn certificate.
server {
    listen 80;
    server_name wsjaly.cn;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/pi-paper/acme;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://wsjaly.cn$request_uri;
    }
}

# Keep the IP preview available without requiring an IP certificate.
server {
    listen 80;
    server_name 60.205.109.84;
    root /var/www/pi-paper/current;
    index index.html;
    charset utf-8;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'self'" always;

    location = /index.html {
        expires -1;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    location ~ /\. {
        deny all;
    }
}

server {
    listen 443 ssl;
    server_name wsjaly.cn;
    root /var/www/pi-paper/current;
    index index.html;
    charset utf-8;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/wsjaly.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/wsjaly.cn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:PiPaperSSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'self'" always;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml;

    location = /index.html {
        expires -1;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    location /assets/ {
        expires 7d;
        try_files $uri =404;
    }

    location ~ /\. {
        deny all;
    }
}
